name: Fetch banner GIF

# Run by hand: opens the Klipy page in a real browser, finds the GIF's media files and commits the best one.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: |
          cd "$RUNNER_TEMP" && npm init -y >/dev/null && npm i playwright@1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: Find and download the GIF
        run: NODE_PATH="$RUNNER_TEMP/node_modules" node .github/check/fetch-banner.mjs
      - name: Commit it
        run: |
          if ls assets/discord-banner-anim.* >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/discord-banner-anim.*
            git commit -m "Add animated profile banner fetched from Klipy" && git push
          else
            echo "No media file found."
          fi
